name: admin-web-ci

on:
  push:
    branches: [main]
    paths:
      - "admin-web/**"
      - ".github/workflows/admin-web-ci.yml"
  pull_request:
    paths:
      - "admin-web/**"
      - ".github/workflows/admin-web-ci.yml"

defaults:
  run:
    working-directory: admin-web

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
